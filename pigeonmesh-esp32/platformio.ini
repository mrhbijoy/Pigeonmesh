; PlatformIO config for PigeonMesh ESP32 firmware.
; The firmware is a single .ino file — no extra headers needed.
; `pio run -t upload` flashes the board. `pio run -t monitor` opens the
; serial console at 115200 baud.
;
; Edit the USER CONFIG block at the top of pigeonmesh-esp32.ino before
; flashing — that's where WIFI_SSID, WIFI_PASS and PM_NODE_URL live.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform         = espressif32@^6.7.0
board            = esp32dev
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
build_flags      = -std=gnu++17
lib_deps         =
  bblanchon/ArduinoJson@^7.1.0
board_build.partitions = default.csv

[env:esp32-c3]
platform         = espressif32@^6.7.0
board            = esp32-c3-devkitm-1
framework        = arduino
monitor_speed    = 115200
build_flags      = -std=gnu++17 -DPIN_REMAP_C3
lib_deps         = ${env:esp32dev.lib_deps}

[env:nodemcu-32s]
platform         = espressif32@^6.7.0
board            = nodemcu-32s
framework        = arduino
monitor_speed    = 115200
build_flags      = -std=gnu++17
lib_deps         = ${env:esp32dev.lib_deps}
