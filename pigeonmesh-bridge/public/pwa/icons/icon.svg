<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A pigeon carrying a message, over a mesh of relay links.
       Drawn as a <symbol> so index.html can <use href="icon.svg#pigeon"/>
       and inherit currentColor for the header and onboarding screens. -->
  <defs>
    <symbol id="pigeon" viewBox="0 0 64 64">
      <!-- mesh links behind the bird -->
      <g stroke="currentColor" stroke-width="1.6" opacity=".38" fill="none">
        <path d="M8 50 L20 40 L34 46 L48 36 L57 44"/>
        <path d="M8 50 L18 24"/>
        <path d="M34 46 L44 20"/>
      </g>
      <g fill="currentColor" opacity=".55">
        <circle cx="8" cy="50" r="3"/>
        <circle cx="20" cy="40" r="2.6"/>
        <circle cx="34" cy="46" r="2.6"/>
        <circle cx="48" cy="36" r="2.6"/>
        <circle cx="57" cy="44" r="3"/>
      </g>
      <!-- body -->
      <path fill="currentColor" d="M44.6 12.2c-3.1 0-5.7 1.8-7 4.4-1.2-.5-2.6-.8-4-.8-8 0-14.6 6-15.5 13.7-.2 1.4-1 2.6-2.2 3.3l-4.2 2.4c-1 .6-.8 2.1.3 2.4l7.3 2c.5.2.9.6 1 1.1l1.6 6.4c.3 1.2 1.9 1.4 2.5.3l2.4-4.2c.5-.9 1.5-1.4 2.5-1.3 9.6.7 17.9-6.6 18.6-16.1.1-1 .1-2 0-3l3.5-3.5c.7-.7.2-1.9-.8-1.9h-3.4c-.4-3.3-3.2-5.9-6.6-5.9z"/>
      <!-- eye, knocked out of the body -->
      <circle cx="45.6" cy="19.4" r="1.7" fill="#0b1220"/>
      <!-- the message it carries -->
      <g transform="translate(20 40)">
        <rect x="0" y="0" width="15" height="10" rx="2" fill="#0b1220"
              stroke="currentColor" stroke-width="1.8"/>
        <path d="M0.8 1.2 L7.5 6 L14.2 1.2" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </g>
    </symbol>
  </defs>
  <use href="#pigeon" fill="#4d8bff" color="#4d8bff"/>
</svg>
