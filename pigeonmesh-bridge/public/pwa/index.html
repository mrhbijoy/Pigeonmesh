<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="PigeonMesh — crisis communication that works with no internet.">
<title>PigeonMesh</title>
<script>
// The same files are served two ways: from a router at / and from the cloud
// bridge under /pwa/. Setting <base> here keeps every relative URL -- assets,
// the manifest, the service worker scope -- correct in both without keeping
// two copies of the markup in sync by hand.
(function() {
  var p = window.location.pathname;
  if (p.indexOf('/pwa/') === 0 || (p.indexOf('/pwa') === 0 && p.length === 4)) {
    var b = document.createElement('base');
    b.href = '/pwa/';
    document.head.appendChild(b);
  }
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Onboarding. Shown once, before an identity exists. -->
<section id="onboard" class="onboard hidden">
  <div class="onboard-card">
    <div class="brand-big" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="64" height="64"><use href="icons/icon.svg#pigeon"/></svg>
    </div>
    <h1 data-t="welcome_title"></h1>
    <p class="muted" data-t="welcome_body"></p>

    <label class="field">
      <span data-t="your_name"></span>
      <input id="ob-name" type="text" maxlength="32" autocomplete="off" enterkeyhint="go">
      <small class="muted" data-t="name_hint"></small>
    </label>

    <div class="lang-row" id="ob-lang"></div>

    <button id="ob-start" class="btn btn-primary btn-lg" data-t="start"></button>
    <p class="muted tiny" data-t="identity_note"></p>
  </div>
</section>

<!-- Main application -->
<div id="app" class="app hidden">

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><use href="icons/icon.svg#pigeon"/></svg>
      <span data-t="app_name"></span>
    </div>
    <button id="link-pill" class="pill" aria-live="polite">
      <span class="dot"></span><span id="link-text"></span>
    </button>
    <button id="lang-toggle" class="pill pill-ghost" data-ta="language"></button>
  </header>

  <div id="clock-warn" class="banner banner-warn hidden" data-t="clock_warning"></div>
  <div id="sos-banner" class="banner banner-sos hidden" role="alert"></div>

  <main id="views">

    <!-- ------------------------------------------------ CHAT -->
    <section class="view" id="view-chat">
      <div class="chan-strip" id="chan-strip"></div>
      <div class="scroll" id="chat-list"></div>
      <form class="composer" id="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="900" enterkeyhint="send">
        <button class="btn btn-primary" type="submit" data-ta="send">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 21l21-9L2 3v7l15 2-15 2z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>

    <!-- ------------------------------------------------ SOS -->
    <section class="view" id="view-sos">
      <div class="scroll">
        <div class="sos-pad">
          <button id="sos-btn" class="sos-btn">
            <span class="sos-ring"></span>
            <span class="sos-label" data-t="sos_hold"></span>
          </button>
        </div>

        <div class="card">
          <label class="field">
            <span data-t="sos_what"></span>
            <input id="sos-text" type="text" maxlength="200">
          </label>
          <div class="field">
            <span data-t="sos_need"></span>
            <div class="chips" id="sos-needs"></div>
          </div>
          <label class="check">
            <input id="sos-geo" type="checkbox" checked>
            <span data-t="include_location"></span>
          </label>
        </div>

        <h2 class="section-h" data-t="sos_active"></h2>
        <div id="sos-list"></div>
      </div>
    </section>

    <!-- ------------------------------------------------ PEOPLE -->
    <section class="view" id="view-people">
      <div class="seg" id="people-seg">
        <button class="seg-btn active" data-seg="safe" data-t="tab_safe"></button>
        <button class="seg-btn" data-seg="missing" data-t="tab_missing"></button>
      </div>
      <div class="scroll">

        <div id="pane-safe">
          <div class="card">
            <button id="safe-btn" class="btn btn-safe btn-lg" data-t="im_safe"></button>
            <small class="muted" data-t="safe_note"></small>
            <label class="field mt">
              <span data-t="where_are_you"></span>
              <input id="safe-where" type="text" maxlength="80">
            </label>
          </div>
          <div id="checkin-list"></div>
        </div>

        <div id="pane-missing" class="hidden">
          <div class="card">
            <details>
              <summary data-t="report_missing"></summary>
              <label class="field"><span data-t="missing_name"></span>
                <input id="mp-name" type="text" maxlength="60"></label>
              <label class="field"><span data-t="missing_age"></span>
                <input id="mp-age" type="number" min="0" max="130" inputmode="numeric"></label>
              <label class="field"><span data-t="missing_desc"></span>
                <textarea id="mp-desc" rows="3" maxlength="300"></textarea></label>
              <label class="field"><span data-t="missing_contact"></span>
                <input id="mp-contact" type="text" maxlength="60"></label>
              <label class="field">
                <span data-t="add_photo"></span>
                <input id="mp-photo" type="file" accept="image/*" capture="environment">
              </label>
              <canvas id="mp-canvas" class="hidden" width="96" height="96"></canvas>
              <button id="mp-submit" class="btn btn-primary" data-t="submit"></button>
            </details>
          </div>
          <label class="field">
            <input id="mp-search" type="search" data-tp="search_name">
          </label>
          <div id="missing-list"></div>
        </div>

      </div>
    </section>

    <!-- ------------------------------------------------ MAP -->
    <section class="view" id="view-map">
      <div class="map-wrap">
        <canvas id="map-canvas"></canvas>
        <div class="map-zoom">
          <button id="map-in" class="zbtn" data-ta="zoom_in">+</button>
          <button id="map-out" class="zbtn" data-ta="zoom_out">&minus;</button>
        </div>
        <div class="map-note hidden" id="map-note"></div>
        <div class="map-tools">
          <button id="map-locate" class="btn btn-ghost btn-sm" data-t="use_my_location"></button>
          <button id="map-save" class="btn btn-ghost btn-sm" data-t="save_area"></button>
          <button id="map-add" class="btn btn-primary btn-sm" data-t="add_pin"></button>
        </div>
        <div class="map-legend" id="map-legend"></div>
      </div>
      <div class="scroll map-list" id="pin-list"></div>
    </section>

    <!-- ------------------------------------------------ MESH -->
    <section class="view" id="view-mesh">
      <div class="scroll">
        <div class="card" id="node-card"></div>
        <h2 class="section-h" data-t="nodes"></h2>
        <div id="topology"></div>
        <h2 class="section-h" data-t="my_identity"></h2>
        <div class="card" id="identity-card"></div>
        <div class="card">
          <div class="row-between">
            <span data-t="language"></span>
            <div class="lang-row" id="settings-lang"></div>
          </div>
          <label class="check mt">
            <input id="carry-toggle" type="checkbox" checked>
            <span data-t="carry_mode"></span>
          </label>
          <small class="muted" data-t="carry_note"></small>
        </div>
        <div class="card danger-card">
          <button id="wipe-btn" class="btn btn-danger" data-t="panic_wipe"></button>
          <small class="muted" data-t="panic_note"></small>
        </div>
        <p class="muted tiny center" id="build-info"></p>
      </div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="chat">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 4h16v11H7l-3 3V4z" fill="currentColor"/></svg>
      <span data-t="nav_chat"></span></button>
    <button class="tab tab-sos" data-view="sos">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2L1 21h22L12 2zm0 6l7 12H5l7-12zm-1 3v5h2v-5h-2zm0 6v2h2v-2h-2z" fill="currentColor"/></svg>
      <span data-t="nav_sos"></span><i class="badge hidden" id="sos-badge"></i></button>
    <button class="tab" data-view="people">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z" fill="currentColor"/></svg>
      <span data-t="nav_people"></span></button>
    <button class="tab" data-view="map">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5.5z" fill="currentColor"/></svg>
      <span data-t="nav_map"></span></button>
    <button class="tab" data-view="mesh">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3a3 3 0 013 3 3 3 0 01-2 2.8V11h5V9.2A3 3 0 0121 6a3 3 0 11-4 2.8V13H7V8.8A3 3 0 113 6a3 3 0 014-2.8V3h5z" fill="currentColor"/><circle cx="12" cy="19" r="3" fill="currentColor"/><path d="M12 13v3" stroke="currentColor" stroke-width="2"/></svg>
      <span data-t="nav_mesh"></span></button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Modal used for pin creation and record detail -->
<div id="sheet" class="sheet hidden">
  <div class="sheet-inner" id="sheet-inner"></div>
</div>

<script src="crypto.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
